services:
  db:
    image: postgres:18
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - /volume1/docker/postgres/data:/var/lib/postgresql/18/docker
    shm_size: 128mb
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD:
    ports:
      - "5434:80"
    depends_on:
      - db
    networks:
      - postgres_network

networks:
  postgres_network:
    name: postgres_network