services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    restart: always
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./lib:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=xxxxx
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ROUTES=172.17.10.0/24
    network_mode: host
    privileged: true