services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - GROCY_DISABLE_AUTH=true
    volumes:
      - /volume1/docker/grocy/config:/config
    ports:
      - 9283:80
    restart: unless-stopped